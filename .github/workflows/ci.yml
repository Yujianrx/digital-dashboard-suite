name: Public project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run check:public
      - run: npm run setup:operations
      - run: npm run test:operations
      - run: npm --prefix operations run type-check
      - run: npm run build
