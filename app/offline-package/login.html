<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登录 · 通用数据看板</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f5fa;color:#18304f;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif;padding:24px}.card{width:min(420px,100%);background:#fff;border:1px solid #dce4ef;border-radius:20px;padding:36px;box-shadow:0 16px 50px #16386110}.mark{background:#1467d8;color:#fff;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;font-size:24px}h1{font-size:25px;margin:20px 0 8px}p{color:#64758c;margin:0 0 24px}label{display:block;margin-top:16px;font-weight:600}input,button{width:100%;font:inherit;border-radius:9px;padding:11px 12px}input{display:block;margin-top:6px;border:1px solid #bccbde}button{margin-top:24px;border:0;background:#1467d8;color:white;cursor:pointer;font-weight:700}button:disabled{opacity:.6}#error{color:#a32424;min-height:24px;margin:12px 0 0}.note{font-size:12px;margin:20px 0 0}
</style></head><body><main class="card"><div class="mark">数</div><h1>登录数据看板</h1><p>使用管理员账号访问共享工作空间。</p><form id="loginForm"><label>用户名<input name="username" autocomplete="username" required value="admin" maxlength="200"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button type="submit">登录</button><p id="error" role="alert"></p></form><p class="note">数据保存在此网站的服务器中。</p></main><script src="./login.js"></script></body></html>
